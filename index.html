<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<title>Monument Draw</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style.css">
	</head>
	<body class="dark">
		<div class="container">
			<canvas id="canvas" width="1024" height="1024"></canvas>
			<div>
				<button id="pngButton" onclick="savePNG()" disabled>Save PNG</button>
				<br><br>
				<button id="gifButton" onclick="saveGIF()" disabled>Save GIF</button>
				<br><br>
				<button onclick="toggleColors()">Toggle Dark/Light</button>
				<br><br>
				<button id="clearButton" onclick="clearDrawing()" disabled>Clear Drawing</button>
				<p>
					Mandala drawing thing inspired by
					<a href="https://www.monumentvalleygame.com/mv2" target="_blank">Monument Valley 2</a>.
					Made by <a href="/">Kasper</a>.
				</p>
			</div>
		</div>
	</body>
</html>
<script src="script.js"></script>
<script src="gif.js"></script>
